
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Tic Tac Toe</h1>
        <p class="subtitle">Challenge Your Friend!</p>

        <div class="scoreboard">
            <div class="score-box">
                <h3>Player X</h3>
                <span id="scoreX">0</span>
            </div>

            <div class="score-box">
                <h3>Draws</h3>
                <span id="scoreDraw">0</span>
            </div>

            <div class="score-box">
                <h3>Player O</h3>
                <span id="scoreO">0</span>
            </div>
        </div>

        <h2 id="status">Player X's Turn</h2>

        <div class="board">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>

        <div class="buttons">
            <button id="newGame">New Game</button>
            <button id="resetScore">Reset Score</button>
        </div>

        <p class="footer">Made with HTML, CSS & JavaScript</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
<script src="script.js"></script>
